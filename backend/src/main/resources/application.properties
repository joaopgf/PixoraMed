# Configuração do backend. Tudo vem de variáveis de ambiente (ou do arquivo backend/.env no desenvolvimento).
# Variável sem valor padrão é obrigatória: se faltar, a aplicação não sobe.

spring.application.name=pixoramed-backend
# Lê o backend/.env, se existir (formato CHAVE=valor)
spring.config.import=optional:file:.env[.properties]

# O Render define PORT; localmente usa 8080
server.port=${PORT:8080}

# Banco PostgreSQL. O Hibernate cria e atualiza as tabelas sozinho (sem migrations)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Login com JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-hours=${JWT_EXPIRATION_HOURS:8}

# Origens do frontend que podem chamar a API, separadas por vírgula
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Microsserviço de IA
app.ai-service.url=${AI_SERVICE_URL}
app.ai-service.token=${AI_SERVICE_TOKEN}
app.ai-service.timeout-seconds=${AI_SERVICE_TIMEOUT_SECONDS:120}

# Abaixo desta confiança o resultado é "inconclusive" (não vale para modelos com limiar próprio, como o da Pele)
app.inconclusive-threshold=${INCONCLUSIVE_THRESHOLD:0.8}

# Importa o training-results.csv ao iniciar (só acrescenta linhas novas)
app.import-trainings-on-startup=${IMPORT_TRAININGS_ON_STARTUP:true}

# Tamanho máximo da imagem enviada
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB
