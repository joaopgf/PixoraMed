# Ambiente LOCAL de desenvolvimento: PostgreSQL, ai-service, backend e frontend (Vite) em containers.
# Não é usado em produção (lá: Vercel + Render + Neon, criados pelo Terraform).
# Uso, dentro de infra/:  copy .env.example .env  (e preencha)  ->  docker compose up --build
# Site: http://localhost:5173 · API: http://localhost:8080/api/health
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    ports:
      # Só no próprio computador, para pgAdmin ou para rodar o backend fora do Docker
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 10
    networks: [pixoramed]

  # Microsserviço de IA: não acessa o banco e só é acessado pelo backend (sem porta exposta)
  ai-service:
    build: ../ai-service
    environment:
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
    volumes:
      # Modelos novos aparecem sem rebuild (reinicie o serviço)
      - ../ai-service/models:/app/models:ro
    networks: [pixoramed]

  backend:
    build: ../backend
    environment:
      DATABASE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB}
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      AI_SERVICE_URL: http://ai-service:8001
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN}
    ports:
      - "127.0.0.1:8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/api/health || exit 1"]
      interval: 10s
      start_period: 40s
      retries: 10
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    networks: [pixoramed]

  # Frontend em modo desenvolvimento (Vite), com o código montado: alterações aparecem na hora
  frontend:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run dev"
    environment:
      BACKEND_URL: http://backend:8080
      # No Windows/macOS a pasta montada não avisa o container das alterações: o Vite confere por polling
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ../frontend:/app
      - frontend-node-modules:/app/node_modules
    ports:
      - "127.0.0.1:5173:5173"
    depends_on:
      backend:
        condition: service_healthy
    networks: [pixoramed]

volumes:
  db-data:
  frontend-node-modules:

networks:
  pixoramed:
