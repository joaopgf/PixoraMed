# Sobe o PixoraMed inteiro: docker compose up --build
# App em http://localhost:8080 · API em http://localhost:8000/docs · IA em http://localhost:8001/docs
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pixoramed
      POSTGRES_USER: pixoramed
      POSTGRES_PASSWORD: pixoramed
    volumes:
      - dados_db:/var/lib/postgresql/data
    ports:
      # Acesso pelo pgAdmin: localhost:5433 (a 5432 fica livre para o Postgres local)
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixoramed"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql://pixoramed:pixoramed@db:5432/pixoramed
      CORS_ORIGINS: http://localhost:8080,http://localhost:5173
      IA_URL: http://ia:8001
      IA_TOKEN: token-local-ia
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      ia:
        condition: service_started

  # Microsserviço de IA: carrega os modelos ONNX e devolve probabilidades. Não acessa o banco.
  ia:
    build:
      context: .
      dockerfile: ia/Dockerfile
    environment:
      # Só para uso local. Na nuvem, o Terraform gera um token aleatório
      IA_TOKEN: token-local-ia
    volumes:
      # Modelos novos aparecem sem rebuild (reinicie o serviço ia)
      - ./models:/app/models:ro
    ports:
      - "8001:8001"

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  dados_db:
