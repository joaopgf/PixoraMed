server {
    listen 80;
    root /usr/share/nginx/html;
    # Um pouco acima dos 10 MB da API, para a resposta de arquivo grande vir dela
    client_max_body_size 11m;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
    }

    # Rotas do React Router (/analisar, /resultados...) caem no index.html
    location / {
        try_files $uri /index.html;
    }
}
